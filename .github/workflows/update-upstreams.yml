name: Update Dashy image

on:
  schedule:
    # 19:20 UTC = 03:20 Asia/Shanghai
    - cron: "20 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update pinned Dashy tag
        run: bash scripts/update-upstreams.sh

      - name: Validate compose
        run: docker compose config --quiet

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          if git diff --cached --quiet; then
            echo "No Dashy image updates."
            exit 0
          fi
          git commit -m "chore: update Dashy image"
          git push
