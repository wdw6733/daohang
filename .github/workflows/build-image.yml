name: Build image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - server.py
      - netbird-status.py
      - site/**
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/wdw6733/daohang:latest
            ghcr.io/wdw6733/daohang:sha-${{ github.sha }}
