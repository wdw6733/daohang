pageInfo:
  title: 导航页
  description: Docker 应用、PT站与技术社区一页入口

appConfig:
  theme: colorful
  layout: auto
  iconSize: medium
  startingView: home
  defaultOpeningMethod: newtab
  statusCheck: true
  statusCheckInterval: 60
  webSearch:
    searchEngine: duckduckgo
    openingMethod: newtab
  hideComponents:
    hideHeading: true
    hideNav: true

